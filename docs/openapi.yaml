          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        category:
          type: string
        description:
          type: string
        amount:
          type: string
          pattern: '^\d{1,12}\.\d{2}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        expense_date:
          type: string
          format: date
        responsible_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [recorded, void]
        created_at:
          type: string
          format: date-time
    RequestExportRequest:
