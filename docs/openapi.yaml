openapi: 3.1.0
info:
  title: Kermesfera API
  version: 0.2.0
  description: >-
    Contrato inicial del Hito 0. Las operaciones marcadas como planned aún no tienen
    controlador; event.close permanece blocked hasta aprobar su autorización. Todas las
    rutas API, salvo salud, pueden responder 429 cuando superan el límite por identidad/IP
    y acción.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Technical
  - name: Identity
  - name: Catalog
  - name: Store
  - name: Sales
  - name: Payments
  - name: Tickets
  - name: Expenses
  - name: Reports
  - name: Exports
  - name: Closure
paths:
  /health:
    get:
      tags: [Technical]
      operationId: getHealth
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /organizations/{organizationId}/events/{eventId}/access-assignments:
    post:
      tags: [Identity]
      operationId: assignEventAccess
      summary: Crear o reemplazar el acceso de una persona a un evento.
      description: Requiere org.manage_members y confirma asignación, roles, auditoría e idempotencia en una transacción.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignEventAccessRequest'
      responses:
        '201':
          description: Asignación creada o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccessAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/events/{eventId}/access-assignments/{targetUserId}/roles:
    patch:
      tags: [Identity]
      operationId: changeEventRoles
      summary: Reemplazar todos los roles de una asignación activa.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/TargetUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  $ref: '#/components/schemas/EventRoles'
      responses:
        '200':
          description: Roles reemplazados o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/events/{eventId}/access-assignments/{targetUserId}:
    delete:
      tags: [Identity]
      operationId: revokeEventAccess
      summary: Revocar una asignación y todas sus delegaciones activas.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/TargetUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acceso revocado o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccessRevocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/access-assignments/{targetUserId}:
    delete:
      tags: [Identity]
      operationId: revokeOrganizationAccess
      summary: Revocar la vinculación de una persona con la organización.
      description: >-
        Requiere org.manage_members. Conserva la identidad global, pero revoca
        atómicamente la membresía organizacional, todos sus accesos de evento y
        delegaciones activas. Propietarios y autorrevocación requieren otro flujo.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/TargetUserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Acceso organizacional revocado o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccessRevocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/ownership-transfers:
    post:
      tags: [Identity]
      operationId: transferOrganizationOwnership
      summary: Transferir la responsabilidad principal de una organización.
      description: >-
        Solo el propietario activo puede transferir. El nuevo propietario debe ser
        miembro activo y el acceso residual del anterior se declara explícitamente.
        La promoción, degradación, roles y auditoría se confirman juntos.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOrganizationOwnershipRequest'
      responses:
        '200':
          description: Propiedad transferida o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOrganizationOwnershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/invitations:
    post:
      tags: [Identity]
      operationId: createInvitation
      summary: Crear una invitación y encolar su entrega por correo.
      description: La respuesta y el outbox nunca contienen el token plano; el trabajador lo deriva usando invitation_id y la versión de clave.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '202':
          description: Invitación confirmada y entrega encolada, o respuesta original recuperada.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invitations/accept:
    post:
      tags: [Identity]
      operationId: acceptInvitation
      summary: Aceptar una invitación mediante su token de un solo uso.
      description: >-
        Ruta pública. Bloquea y consume la invitación, crea o reactiva identidad,
        membresía organizacional y acceso de evento en una sola transacción. No usa
        Idempotency-Key: el token aleatorio es la capacidad única y no se persiste en
        texto plano; un segundo uso devuelve 422 sin repetir efectos.
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Invitación aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /public/events/{slug}/catalog:
    get:
      tags: [Store]
      operationId: getPublicEventCatalog
      security: []
      x-implementation-status: implemented
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        '200':
          description: Evento y productos activos con disponibilidad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCatalogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/events/{slug}/orders:
    post:
      tags: [Store]
      operationId: createPublicOrder
      security: []
      x-implementation-status: implemented
      description: Reserva inventario por 15 minutos para un pago QR pendiente de revisión.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicOrderRequest'
      responses:
        '201':
          description: Reserva creada sin habilitar todavía el ticket.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/events/{eventId}/catalog/products:
    get:
      tags: [Catalog]
      operationId: listSaleCatalogProducts
      description: Catálogo interno de solo lectura para responsables y operadores con `catalog.read`.
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused]
      responses:
        '200':
          description: Productos visibles, precios vigentes y disponibilidad calculada del evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCatalogPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/sales:
    get:
      tags: [Sales]
      operationId: listSales
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, confirmed, cancelled, refunded]
        - name: payment_status
          in: query
          schema:
            type: string
            enum: [pending, to_verify, confirmed, rejected, cancelled, refunded]
        - name: buyer_email
          in: query
          schema:
            type: string
            format: email
            maxLength: 254
        - name: created_from
          in: query
          schema:
            type: string
            format: date-time
        - name: created_until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Página de ventas filtradas por organización y evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Sales]
      operationId: createSale
      x-implementation-status: implemented
      description: La primera implementación acepta efectivo y confirma venta, pago, inventario y ticket en una sola transacción idempotente.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Venta creada atómicamente.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/payments/{paymentId}/confirmation:
    post:
      tags: [Payments]
      operationId: confirmPayment
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [result]
              properties:
                result:
                  type: string
                  enum: [confirmed, rejected]
                note:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '200':
          description: Resultado del pago confirmado y auditado.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResourceResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/events/{eventId}/sales/{saleId}/payment/review:
    post:
      tags: [Payments]
      operationId: reviewSalePayment
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/SaleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReviewRequest'
      responses:
        '200':
          description: Reserva confirmada o rechazada atómicamente.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /organizations/{organizationId}/events/{eventId}/tickets/{ticketId}/redemptions:
    post:
      tags: [Tickets]
      operationId: redeemTicket
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [ticket_item_id, quantity]
                    properties:
                      ticket_item_id:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: Canje único confirmado.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResourceResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
            maxLength: 80
        - name: responsible_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: expense_from
          in: query
          schema:
            type: string
            format: date
        - name: expense_until
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Página de gastos limitada al evento autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Expenses]
      operationId: createExpense
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Gasto registrado y auditado dentro de una transacción.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/exports:
    post:
      tags: [Exports]
      operationId: requestEventExport
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestExportRequest'
      responses:
        '202':
          description: Trabajo de exportación único encolado para procesamiento fuera de la petición.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/exports/{exportJobId}:
    get:
      tags: [Exports]
      operationId: getEventExport
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ExportJobId'
      responses:
        '200':
          description: Estado del trabajo; la URL de descarga solo aparece al completarse y debe ser temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Trabajo inexistente dentro del alcance autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /organizations/{organizationId}/events/{eventId}/reports/balance:
    get:
      tags: [Reports]
      operationId: getEventBalance
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - name: as_of
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Balance calculado para el evento y corte solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResourceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/{organizationId}/events/{eventId}/closure:
    post:
      tags: [Closure]
      operationId: closeEvent
      description: Contrato reservado. No se habilitará hasta aprobar responsable, controles y posible doble autorización.
      x-implementation-status: blocked
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '501':
          description: Cierre deliberadamente no implementado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT HS256 con sub UUID, iss, aud, iat y exp obligatorios. El backend valida firma,
        emisor, audiencia, vigencia y duración máxima antes de colocar sub en el contexto interno.
        La emisión de credenciales pertenece al proveedor de identidad y no a estos endpoints.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportJobId:
      name: exportJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave opaca de 1 a 128 caracteres; no incluir secretos ni datos personales.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    IdempotencyReplayed:
      description: true cuando la respuesta proviene de una ejecución anterior confirmada.
      schema:
        type: string
        enum: ['true', 'false']
  responses:
    BadRequest:
      description: JSON o encabezados inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Falta autenticación válida.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: La identidad no tiene autorización para el alcance solicitado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El recurso solicitado no existe o no está publicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: La clave fue reutilizada con otra carga o existe un conflicto de ejecución.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: El comando contradice reglas del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Se excedió el límite temporal de solicitudes para la identidad/IP y acción.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          schema:
            type: integer
            const: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
    AssignEventAccessRequest:
      type: object
      additionalProperties: false
      required: [target_user_id, access_type, roles]
      properties:
        target_user_id:
          type: string
          format: uuid
        access_type:
          type: string
          enum: [operational, historical]
        roles:
          $ref: '#/components/schemas/EventRoles'
        valid_from:
          type: [string, 'null']
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
    EventAccessAssignmentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [event_membership_id, target_user_id, organization_id, event_id, access_type, roles]
          properties:
            event_membership_id:
              type: string
              format: uuid
            target_user_id:
              type: string
              format: uuid
            organization_id:
              type: string
              format: uuid
            event_id:
              type: string
              format: uuid
            access_type:
              type: string
              enum: [operational, historical]
            roles:
              type: array
              items:
                type: string
    EventRoles:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [EVENT_MANAGER, FINANCE_REVIEWER, SALES_OPERATOR, PAYMENT_REVIEWER, TICKET_OPERATOR, REPORT_VIEWER, HISTORICAL_VIEWER]
    EventRolesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [event_membership_id, target_user_id, roles]
          properties:
            event_membership_id:
              type: string
              format: uuid
            target_user_id:
              type: string
              format: uuid
            roles:
              $ref: '#/components/schemas/EventRoles'
    EventAccessRevocationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [event_membership_id, target_user_id, status]
          properties:
            event_membership_id:
              type: string
              format: uuid
            target_user_id:
              type: string
              format: uuid
            status:
              type: string
              const: revoked
    OrganizationAccessRevocationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [organization_membership_id, target_user_id, status]
          properties:
            organization_membership_id:
              type: string
              format: uuid
            target_user_id:
              type: string
              format: uuid
            status:
              type: string
              const: revoked
    TransferOrganizationOwnershipRequest:
      type: object
      additionalProperties: false
      required: [new_owner_user_id, previous_owner_access_type]
      properties:
        new_owner_user_id:
          type: string
          format: uuid
        previous_owner_access_type:
          type: string
          enum: [administrator, collaborator]
    TransferOrganizationOwnershipResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [new_owner_membership_id, new_owner_user_id, previous_owner_access_type, status]
          properties:
            new_owner_membership_id:
              type: string
              format: uuid
            new_owner_user_id:
              type: string
              format: uuid
            previous_owner_access_type:
              type: string
              enum: [administrator, collaborator]
            status:
              type: string
              const: transferred
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, target_access_type, roles, expires_at]
      properties:
        event_id:
          type: [string, 'null']
          format: uuid
        email:
          type: string
          format: email
        target_access_type:
          type: string
          enum: [administrator, collaborator, operational, historical]
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [EVENT_MANAGER, FINANCE_REVIEWER, SALES_OPERATOR, PAYMENT_REVIEWER, TICKET_OPERATOR, REPORT_VIEWER, HISTORICAL_VIEWER]
        expires_at:
          type: string
          format: date-time
    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [invitation_id, delivery_id, delivery_status, expires_at, roles]
          properties:
            invitation_id:
              type: string
              format: uuid
            delivery_id:
              type: string
              format: uuid
            delivery_status:
              type: string
              const: queued
            expires_at:
              type: string
              format: date-time
            roles:
              type: array
              items:
                type: string
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, email, display_name]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 160
    AcceptInvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user_id, status]
          properties:
            user_id:
              type: string
              format: uuid
            status:
              type: string
              const: accepted
    PublicCatalogResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [event, products]
          properties:
            event:
              type: object
              additionalProperties: false
              required: [id, organization_id, organization_name, slug, name, status, date]
              properties:
                id: { type: string, format: uuid }
                organization_id: { type: string, format: uuid }
                organization_name: { type: string }
                slug: { type: string }
                name: { type: string }
                status: { type: string }
                date: { type: [string, 'null'] }
            products:
              type: array
              items:
                $ref: '#/components/schemas/PublicCatalogProduct'
    PublicCatalogProduct:
      type: object
      additionalProperties: false
      required: [id, stand_id, stand_name, code, name, unit_price, unit_price_minor, currency, stock, sold, available_quantity, version]
      properties:
        id: { type: string, format: uuid }
        stand_id: { type: string, format: uuid }
        stand_name: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        unit_price: { $ref: '#/components/schemas/MoneyAmount' }
        unit_price_minor: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        stock: { type: integer, minimum: 0 }
        sold: { type: integer, minimum: 0 }
        available_quantity: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    PublicOrderRequest:
      type: object
      additionalProperties: false
      required: [buyer_email, items]
      properties:
        buyer_email:
          type: string
          format: email
          maxLength: 254
        buyer_name:
          type: [string, 'null']
          maxLength: 160
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [event_product_id, quantity]
            properties:
              event_product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    PublicOrderResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [sale_id, ticket_id, ticket_number, status, payment_status, buyer_email, total, currency, created_at, reservation_expires_at]
          properties:
            sale_id: { type: string, format: uuid }
            ticket_id: { type: string, format: uuid }
            ticket_number: { type: string }
            status: { type: string, const: pending_payment }
            payment_status: { type: string, const: to_verify }
            buyer_email: { type: string, format: email }
            buyer_name: { type: [string, 'null'] }
            total: { $ref: '#/components/schemas/MoneyAmount' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
            created_at: { type: string, format: date-time }
            reservation_expires_at: { type: string, format: date-time }
    PaymentReviewRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [confirm, reject]
        provider_reference:
          type: [string, 'null']
          maxLength: 128
    PaymentReviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [sale_id, payment_id, decision, sale_status, payment_status, reviewed_at]
          properties:
            sale_id: { type: string, format: uuid }
            payment_id: { type: string, format: uuid }
            decision: { type: string, enum: [confirm, reject] }
            sale_status: { type: string, enum: [confirmed, cancelled] }
            payment_status: { type: string, enum: [confirmed, rejected] }
            reviewed_at: { type: string, format: date-time }
    CreateSaleRequest:
      type: object
      additionalProperties: false
      required: [buyer_email, payment_method, items]
      properties:
        buyer_email:
          type: string
          format: email
          maxLength: 254
        buyer_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        buyer_phone:
          type: [string, 'null']
          minLength: 3
          maxLength: 40
        payment_method:
          type: string
          const: cash
          description: Solo efectivo está habilitado en esta primera implementación; otros medios esperan reglas de reserva y confirmación.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [event_product_id, quantity]
            properties:
              event_product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
    SaleCatalogPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SaleCatalogProduct'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SaleCatalogProduct:
      type: object
      additionalProperties: false
      required: [id, stand_id, stand_name, code, name, unit_price, unit_price_minor, currency, stock, sold, available_quantity, status, active, version]
      properties:
        id:
          type: string
          format: uuid
        stand_id:
          type: string
          format: uuid
        stand_name:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        unit_price:
          $ref: '#/components/schemas/MoneyAmount'
        unit_price_minor:
          type: integer
          minimum: 0
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        stock:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        available_quantity:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, paused]
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
    SaleResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Sale'
    SalePageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Sale:
      type: object
      additionalProperties: false
      required: [id, organization_id, event_id, operator_user_id, channel, status, buyer_email, subtotal, discount_total, total, currency, payment, items, ticket, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        operator_user_id:
          type: string
          format: uuid
        operator_name:
          type: string
        channel:
          type: string
          enum: [operator, online]
        status:
          type: string
          enum: [pending_payment, confirmed, cancelled, refunded]
        buyer_email:
          type: string
          format: email
        buyer_name:
          type: [string, 'null']
        buyer_phone:
          type: [string, 'null']
        subtotal:
          $ref: '#/components/schemas/MoneyAmount'
        discount_total:
          $ref: '#/components/schemas/MoneyAmount'
        total:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        payment:
          $ref: '#/components/schemas/SalePayment'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItem'
        ticket:
          oneOf:
            - $ref: '#/components/schemas/SaleTicket'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, 'null']
          format: date-time
        reservation_expires_at:
          type: [string, 'null']
          format: date-time
    SaleItem:
      type: object
      additionalProperties: false
      required: [id, event_product_id, product_code, product_name, unit_price, quantity, line_total]
      properties:
        id:
          type: string
          format: uuid
        event_product_id:
          type: string
          format: uuid
        product_code:
          type: string
        product_name:
          type: string
        unit_price:
          $ref: '#/components/schemas/MoneyAmount'
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: '#/components/schemas/MoneyAmount'
        version:
          type: integer
          minimum: 1
    SalePayment:
      type: object
      additionalProperties: false
      required: [id, method, status, amount, currency]
      properties:
        id:
          type: string
          format: uuid
        method:
          type: string
        status:
          type: string
          enum: [pending, to_verify, confirmed, rejected, cancelled, refunded]
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        confirmed_at:
          type: [string, 'null']
          format: date-time
    SaleTicket:
      type: object
      additionalProperties: false
      required: [id, ticket_number, qr_code, status]
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: string
        qr_code:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
        status:
          type: string
          enum: [pending, issued, active, partially_redeemed, redeemed, cancelled, void]
    MoneyAmount:
      type: string
      pattern: '^\d{1,12}\.\d{2}$'
      description: Importe decimal no negativo enviado como texto para evitar pérdida de precisión.
      example: '120.00'
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      example: BOB
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [category, description, amount, currency, expense_date]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 500
        amount:
          type: string
          pattern: '^\d{1,12}\.\d{2}$'
          description: Importe decimal positivo enviado como texto para evitar pérdida de precisión.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: BOB
        expense_date:
          type: string
          format: date
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Expense'
    ExpensePageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Expense:
      type: object
      additionalProperties: false
      required: [id, organization_id, event_id, category, description, amount, currency, expense_date, responsible_user_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        category:
          type: string
        description:
          type: string
        amount:
          type: string
          pattern: '^\d{1,12}\.\d{2}$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        expense_date:
          type: string
          format: date
        responsible_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [recorded, void]
        created_at:
          type: string
          format: date-time
    RequestExportRequest:
      type: object
      additionalProperties: false
      required: [report_type, format]
      properties:
        report_type:
          type: string
          enum: [sales, payments, expenses, inventory, ticket_allocations, redemptions, audit, balance]
        format:
          type: string
          enum: [pdf, xlsx]
        filters:
          type: object
          additionalProperties: true
          default: {}
    ExportJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, report_type, format, status, created_at]
          properties:
            id:
              type: string
              format: uuid
            report_type:
              type: string
            format:
              type: string
              enum: [pdf, xlsx]
            status:
              type: string
              enum: [pending, processing, completed, failed]
            download_url:
              type: [string, 'null']
              format: uri
              description: URL temporal; null hasta completar el trabajo.
            created_at:
              type: string
              format: date-time
            completed_at:
              type: [string, 'null']
              format: date-time
    CommandResourceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    PaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
