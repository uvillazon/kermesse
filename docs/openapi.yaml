        expires_at:
          type: string
          format: date-time
    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [invitation_id, delivery_id, delivery_status, expires_at, roles]
          properties:
            invitation_id:
              type: string
              format: uuid
            delivery_id:
              type: string
              format: uuid
            delivery_status:
              type: string
              const: queued
            expires_at:
              type: string
              format: date-time
            roles:
              type: array
              items:
                type: string
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, email, display_name]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 160
    AcceptInvitationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user_id, status]
          properties:
            user_id:
              type: string
              format: uuid
            status:
              type: string
              const: accepted
    CreateSaleRequest:
      type: object
      additionalProperties: false
      required: [buyer_email, items]
      properties:
        buyer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [event_product_id, quantity]
            properties:
              event_product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [category, description, amount, currency, expense_date]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 500
        amount:
          type: string
          pattern: '^\d{1,12}\.\d{2}$'
          description: Importe decimal positivo enviado como texto para evitar pérdida de precisión.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: BOB
        expense_date:
          type: string
          format: date
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Expense'
    ExpensePageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Expense:
      type: object
      additionalProperties: false
      required: [id, organization_id, event_id, category, description, amount, currency, expense_date, responsible_user_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
